<!DOCTYPE html>
<html lang="{{ language }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ doc_type }} — {{ job_title }} @ {{ job_company }}</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { padding: 0; margin: 0; }
            .document-container { box-shadow: none; border: none; max-width: 100%; }
        }
        .document-container h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.25rem; }
        .document-container h2 { font-size: 1.1rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.5rem; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.25rem; }
        .document-container p { margin-bottom: 0.5rem; line-height: 1.6; }
        .document-container ul { margin-left: 1.25rem; margin-bottom: 0.75rem; }
        .document-container li { margin-bottom: 0.25rem; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Top bar -->
    <div class="no-print bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
        <a href="/results" class="text-sm text-gray-500 hover:text-gray-700 flex items-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>
            {{ t.get("back_to_results", "Retour aux résultats") }}
        </a>
        <div class="flex items-center gap-3">
            <span class="text-sm text-gray-600 font-medium">{{ doc_type }} — {{ job_title }} @ {{ job_company }}</span>
            <button onclick="window.print()"
                class="text-sm text-indigo-600 hover:text-indigo-800 border border-indigo-200 hover:border-indigo-300 rounded-lg px-3 py-1.5 cursor-pointer bg-white flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6.72 13.829c-.24.03-.48.062-.72.096m.72-.096a42.415 42.415 0 0 1 10.56 0m-10.56 0L6.34 18m10.94-4.171c.24.03.48.062.72.096m-.72-.096L17.66 18m0 0 .229 2.523a1.125 1.125 0 0 1-1.12 1.227H7.231c-.662 0-1.18-.568-1.12-1.227L6.34 18m11.318 0h1.091A2.25 2.25 0 0 0 21 15.75V9.456c0-1.081-.768-2.015-1.837-2.175a48.055 48.055 0 0 0-1.913-.247M6.34 18H5.25A2.25 2.25 0 0 1 3 15.75V9.456c0-1.081.768-2.015 1.837-2.175a48.041 48.041 0 0 1 1.913-.247m0 0a48.56 48.56 0 0 1 10.5 0m-10.5 0V5.625c0-.621.504-1.125 1.125-1.125h8.25c.621 0 1.125.504 1.125 1.125v2.034"/></svg>
                {{ t.get("print_btn", "Imprimer / PDF") }}
            </button>
            <button onclick="copyContent()" id="copy-btn"
                class="text-sm text-indigo-600 hover:text-indigo-800 border border-indigo-200 hover:border-indigo-300 rounded-lg px-3 py-1.5 cursor-pointer bg-white flex items-center gap-1.5">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9.75a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184"/></svg>
                {{ t.get("copy_btn", "Copier") }}
            </button>
        </div>
    </div>

    <!-- Document -->
    <div class="max-w-[800px] mx-auto my-8 bg-white shadow-lg rounded-lg p-10 document-container" id="document-content">
        {{ content | safe }}
    </div>

    <script>
    function copyContent() {
        const content = document.getElementById('document-content').innerText;
        navigator.clipboard.writeText(content).then(() => {
            const btn = document.getElementById('copy-btn');
            const original = btn.innerHTML;
            btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5"/></svg> {{ t.get("copied", "Copié !") }}';
            setTimeout(() => btn.innerHTML = original, 2000);
        });
    }
    </script>
</body>
</html>
