<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cvly - AI Job Agent</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        score: {
                            high: '#16a34a',
                            medium: '#d97706',
                            low: '#ea580c',
                            poor: '#dc2626'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-request.htmx-indicator { display: inline-block; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex h-screen overflow-hidden">
    <aside class="w-[220px] bg-white border-r border-slate-200 flex flex-col justify-between p-5 overflow-y-auto">
        <div>
            <div class="mb-8">
                <h1 class="text-3xl font-bold text-indigo-600">Cvly</h1>
            </div>

            <nav class="space-y-2">
                <a href="/" class="flex items-center px-3 py-2 rounded-lg hover:bg-slate-50 transition-colors {{ 'bg-slate-100 font-medium' if request.url.path == '/' else 'text-slate-600' }}">Dashboard</a>
                <a href="/settings" class="flex items-center px-3 py-2 rounded-lg hover:bg-slate-50 transition-colors {{ 'bg-slate-100 font-medium' if request.url.path == '/settings' else 'text-slate-600' }}">Settings</a>
                <a href="/results" class="flex items-center px-3 py-2 rounded-lg hover:bg-slate-50 transition-colors {{ 'bg-slate-100 font-medium' if request.url.path.startswith('/results') else 'text-slate-600' }}">Results</a>
            </nav>
        </div>

        <div class="text-sm text-slate-500 mt-auto">
            <p>Cvly — AI Job Application Agent · v1.0</p>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-end px-5 shrink-0">
            <select class="text-sm border-slate-200 rounded text-slate-600 outline-none p-1">
                <option value="fr">FR</option>
                <option value="en">EN</option>
            </select>
        </header>
        <div class="flex-1 overflow-y-auto p-8 relative">
            <div id="toast-container" class="absolute top-4 right-4 z-50 flex flex-col gap-2"></div>

            {% block content %}{% endblock %}
        </div>
    </main>
</body>
</html>
